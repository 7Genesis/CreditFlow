name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CreditFlow.slnx

      - name: Build
        run: dotnet build CreditFlow.slnx --no-restore -c Release

      - name: Test
        run: dotnet test CreditFlow.slnx --no-build -c Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -t creditflow-api .
