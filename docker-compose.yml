# Sobe a API e o PostgreSQL: docker compose up --build
# Credenciais abaixo são só para desenvolvimento local.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creditflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d creditflow_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=creditflow_db;Username=postgres;Password=postgres"
      Database__MigrateOnStartup: "true"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
